<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#080b10">

<title>RPG — Mestre IA</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #080b10;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea {
    font-family: inherit;
}

button {
    color: white;
    border: 0;
    cursor: pointer;
}


/* =========================================================
   APP
========================================================= */

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}


/* =========================================================
   TOPO
========================================================= */

#topbar {
    height: 54px;
    min-height: 54px;

    display: flex;
    align-items: center;

    padding: 7px 10px;
    gap: 8px;

    background: #111720;
    border-bottom: 1px solid #303949;

    z-index: 1000;
}

#logo {
    flex: 1;
    font-size: 15px;
    font-weight: bold;
}

#connection {
    font-size: 10px;
    padding: 5px 8px;

    border-radius: 20px;
    border: 1px solid #394456;

    opacity: .9;
}

.topButton {
    background: #202938;
    border-radius: 10px;
    padding: 9px;
    font-size: 16px;
}


/* =========================================================
   MUNDO
========================================================= */

#world {
    position: relative;

    flex: 1;

    overflow: hidden;

    background:
        linear-gradient(
            #26372b,
            #182219
        );

    touch-action: none;
}


/* =========================================================
   CAMADAS
========================================================= */

#layers {
    position: absolute;
    inset: 0;

    overflow: hidden;
}

.layer {
    position: absolute;

    inset: 0;

    pointer-events: none;
}


/* =========================================================
   ELEMENTOS CRIADOS PELO MESTRE
========================================================= */

.worldElement {
    position: absolute;

    transform-origin: center center;

    user-select: none;

    pointer-events: auto;

    touch-action: manipulation;

    white-space: pre-wrap;
}

.emojiElement {
    font-size: clamp(
        30px,
        9vw,
        80px
    );

    filter:
        drop-shadow(
            0 4px 4px rgba(0,0,0,.6)
        );
}

.imageElement {
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
}


/* =========================================================
   HUD
========================================================= */

#hud {
    position: absolute;

    top: 8px;
    left: 8px;
    right: 8px;

    display: flex;

    gap: 6px;

    flex-wrap: wrap;

    z-index: 500;

    pointer-events: none;
}

.hudBox {
    padding: 6px 9px;

    border-radius: 10px;

    background: rgba(8,12,18,.88);

    border: 1px solid #394456;

    font-size: 11px;
}


/* =========================================================
   MENSAGEM DO MESTRE
========================================================= */

#masterMessage {
    position: absolute;

    left: 8px;
    right: 8px;

    bottom: 8px;

    z-index: 700;

    padding: 9px 11px;

    border-radius: 13px;

    background: rgba(8,12,18,.90);

    border: 1px solid #394456;

    pointer-events: none;

    backdrop-filter: blur(5px);
}

#masterMessageTitle {
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 3px;
}

#masterMessageText {
    font-size: 13px;
    color: #dce2eb;
}


/* =========================================================
   AÇÕES DINÂMICAS
========================================================= */

#dynamicActions {
    position: absolute;

    left: 8px;
    right: 8px;

    bottom: 75px;

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 7px;

    z-index: 800;

    pointer-events: none;
}

.dynamicButton {
    pointer-events: auto;

    padding: 9px 12px;

    border-radius: 11px;

    background: rgba(20,29,42,.95);

    border: 1px solid #46546a;

    color: white;
}


/* =========================================================
   BARRA INFERIOR
========================================================= */

#bottomBar {
    height: 70px;
    min-height: 70px;

    display: flex;

    gap: 6px;

    padding: 7px;

    background: #111720;

    border-top: 1px solid #303949;

    z-index: 1000;
}

.bottomButton {
    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 2px;

    border-radius: 12px;

    background: #1a2230;

    border: 1px solid #354052;

    font-size: 18px;
}

.bottomButton span {
    font-size: 10px;
}


/* =========================================================
   PAINÉIS
========================================================= */

.panel {
    position: absolute;

    top: 54px;
    bottom: 70px;

    left: 0;
    right: 0;

    z-index: 2000;

    display: none;

    overflow: auto;

    padding: 14px;

    background: rgba(10,14,21,.98);
}

.panel.active {
    display: block;
}

.panelTitle {
    font-size: 20px;
    font-weight: bold;

    margin-bottom: 15px;
}

.closeButton {
    float: right;

    padding: 8px 11px;

    border-radius: 9px;

    background: #252d3b;
}


/* =========================================================
   CARDS
========================================================= */

.card {
    padding: 12px;

    margin-bottom: 10px;

    border-radius: 13px;

    background: #161e2a;

    border: 1px solid #364154;
}

.card button {
    padding: 9px;

    margin: 3px;

    border-radius: 9px;

    background: #1d2736;

    border: 1px solid #3c485c;
}

.card input,
.card textarea {
    width: 100%;

    padding: 10px;

    border-radius: 9px;

    color: white;

    background: #101722;

    border: 1px solid #3b4659;

    outline: none;
}


/* =========================================================
   INVENTÁRIO
========================================================= */

.inventoryItem {
    padding: 10px;

    margin-bottom: 7px;

    border-radius: 10px;

    background: #161e2a;

    border: 1px solid #364154;
}


/* =========================================================
   STATUS
========================================================= */

.statusRow {
    display: flex;

    justify-content: space-between;

    padding: 10px;

    margin-bottom: 7px;

    border-radius: 10px;

    background: #161e2a;

    border: 1px solid #364154;
}


/* =========================================================
   CHAT
========================================================= */

#chatLog {
    height: calc(100% - 120px);

    min-height: 180px;

    overflow-y: auto;

    padding: 8px;

    border-radius: 12px;

    background: #080c12;

    border: 1px solid #303949;
}

.chatMessage {
    padding: 8px;

    border-bottom: 1px solid #242c38;

    font-size: 13px;
}

.chatMessage strong {
    display: block;

    margin-bottom: 3px;
}

#chatArea {
    display: flex;

    gap: 7px;

    margin-top: 8px;
}

#chatInput {
    flex: 1;

    resize: none;

    color: white;

    background: #111822;

    border: 1px solid #384356;

    border-radius: 10px;

    padding: 9px;
}

#sendChat {
    width: 52px;

    border-radius: 10px;

    background: #202b3b;

    border: 1px solid #455268;
}


/* =========================================================
   MODO PAISAGEM
========================================================= */

@media (orientation: portrait) {

    #world::after {

        content: "↻  MODO PAISAGEM RECOMENDADO";

        position: absolute;

        inset: 0;

        display: flex;

        align-items: center;

        justify-content: center;

        background: rgba(0,0,0,.78);

        font-weight: bold;

        font-size: 15px;

        z-index: 9999;

        pointer-events: none;
    }
}

</style>
</head>

<body>

<div id="app">


<!-- =====================================================
     TOPO
===================================================== -->

<header id="topbar">

    <div id="logo">
        🧙 RPG — Mestre IA
    </div>

    <div id="connection">
        ⚪ LOCAL
    </div>

    <button
        class="topButton"
        onclick="openPanel('settings')">

        ⚙️

    </button>

</header>


<!-- =====================================================
     MUNDO
===================================================== -->

<main id="world">

    <div id="layers"></div>

    <div id="hud"></div>

    <div id="dynamicActions"></div>


    <div id="masterMessage">

        <div id="masterMessageTitle">
            🧙 Mestre
        </div>

        <div id="masterMessageText">
            O mundo aguarda sua próxima ação.
        </div>

    </div>

</main>


<!-- =====================================================
     BARRA INFERIOR
===================================================== -->

<nav id="bottomBar">

    <button
        class="bottomButton"
        onclick="openPanel('inventory')">

        🎒
        <span>Inventário</span>

    </button>


    <button
        class="bottomButton"
        onclick="openPanel('status')">

        📊
        <span>Status</span>

    </button>


    <button
        class="bottomButton"
        onclick="openPanel('system')">

        ⚙️
        <span>Sistema</span>

    </button>


    <button
        class="bottomButton"
        onclick="toggleMoveMode()">

        🚶
        <span>Andar</span>

    </button>


    <button
        class="bottomButton"
        onclick="openPanel('master')">

        💬
        <span>Mestre</span>

    </button>

</nav>


<!-- =====================================================
     INVENTÁRIO
===================================================== -->

<section
    id="inventory"
    class="panel">

    <button
        class="closeButton"
        onclick="closePanels()">

        ✕

    </button>

    <div class="panelTitle">
        🎒 Inventário
    </div>

    <div id="inventoryList"></div>

</section>


<!-- =====================================================
     STATUS
===================================================== -->

<section
    id="status"
    class="panel">

    <button
        class="closeButton"
        onclick="closePanels()">

        ✕

    </button>

    <div class="panelTitle">
        📊 Status
    </div>

    <div id="statusList"></div>

</section>


<!-- =====================================================
     SISTEMA
===================================================== -->

<section
    id="system"
    class="panel">

    <button
        class="closeButton"
        onclick="closePanels()">

        ✕

    </button>

    <div class="panelTitle">
        ⚙️ Sistema
    </div>


    <div class="card">

        <button onclick="saveGame()">
            💾 Salvar
        </button>

        <button onclick="loadGame()">
            📂 Carregar
        </button>

        <button onclick="newGame()">
            ↩️ Novo jogo
        </button>

    </div>


    <div class="card">

        <b>📅 Calendário</b>

        <div id="calendarText"></div>

    </div>

</section>


<!-- =====================================================
     CONFIGURAÇÕES
===================================================== -->

<section
    id="settings"
    class="panel">

    <button
        class="closeButton"
        onclick="closePanels()">

        ✕

    </button>

    <div class="panelTitle">
        ⚙️ Configurações
    </div>


    <div class="card">

        <b>📱 Tela</b>

        <br><br>

        <button onclick="fullscreen()">
            ⛶ Tela cheia
        </button>

        <button onclick="landscape()">
            📱 Paisagem
        </button>

    </div>


    <div class="card">

        <b>🌐 Servidor do Mestre</b>

        <br><br>

        <input
            id="serverURL"
            placeholder="https://seu-servidor.com">

        <br><br>

        <button onclick="testServer()">
            🔌 Testar conexão
        </button>

        <p style="font-size:11px;opacity:.65">

            A chave da API deve ficar no servidor,
            não dentro deste HTML.

        </p>

    </div>

</section>


<!-- =====================================================
     MESTRE
===================================================== -->

<section
    id="master"
    class="panel">

    <button
        class="closeButton"
        onclick="closePanels()">

        ✕

    </button>

    <div class="panelTitle">
        🧙 Conversar com o Mestre
    </div>


    <div id="chatLog"></div>


    <div id="chatArea">

        <textarea
            id="chatInput"
            rows="2"
            placeholder="Fale diretamente com o Mestre...">
        </textarea>

        <button id="sendChat">
            ➤
        </button>

    </div>

</section>


</div>


<script>

/* =========================================================
   ESTADO DO RPG
========================================================= */

const DEFAULT_STATE = {

    calendar: {

        year: 3,

        month: 8,

        day: 19

    },


    player: {

        name: "Jogador",

        hp: 100,

        hpMax: 100,

        mana: 80,

        manaMax: 80,

        stamina: 100,

        staminaMax: 100,

        level: 1,

        exp: 0,

        x: 50,

        y: 70

    },


    world: {

        location: "Floresta",

        weather: "normal",

        time: "18:42"

    },


    inventory: [

        {

            name: "Fragmento de Cristal de Sintonia",

            qty: 1

        }

    ],


    /*
       50 CAMADAS INICIAIS.

       Elas podem ficar vazias.

       O Mestre pode utilizar qualquer uma.

       E o sistema permite criar mais.
    */

    layers: Array.from(
        {length: 50},
        () => ({
            elements: []
        })
    ),


    actions: [],


    narrative:
        "O mundo aguarda sua próxima ação."

};


/* =========================================================
   ESTADO ATUAL
========================================================= */

let state =
    JSON.parse(
        localStorage.getItem("RPG_MESTRE_STATE")
    ) || structuredClone(DEFAULT_STATE);


/* =========================================================
   UTILITÁRIOS
========================================================= */

function clone(obj) {

    return JSON.parse(
        JSON.stringify(obj)
    );

}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   PAINÉIS
========================================================= */

function openPanel(id) {

    document
        .querySelectorAll(".panel")
        .forEach(
            p => p.classList.remove("active")
        );

    const panel =
        document.getElementById(id);

    if(panel) {

        panel.classList.add("active");

    }

}


function closePanels() {

    document
        .querySelectorAll(".panel")
        .forEach(
            p => p.classList.remove("active")
        );

}


/* =========================================================
   TELA CHEIA
========================================================= */

async function fullscreen() {

    try {

        if(!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        }

    }

    catch(e) {

        console.log(e);

    }

}


/* =========================================================
   PAISAGEM
========================================================= */

async function landscape() {

    try {

        if(
            screen.orientation &&
            screen.orientation.lock
        ) {

            await screen.orientation.lock(
                "landscape"
            );

        }

    }

    catch(e) {

        alert(
            "O navegador pode não permitir bloquear a orientação."
        );

    }

}


/* =========================================================
   HUD
========================================================= */

function renderHUD() {

    const p = state.player;

    document.getElementById("hud").innerHTML = `

        <div class="hudBox">
            ❤️ ${p.hp}/${p.hpMax}
        </div>

        <div class="hudBox">
            💙 ${p.mana}/${p.manaMax}
        </div>

        <div class="hudBox">
            🟢 ${p.stamina}/${p.staminaMax}
        </div>

        <div class="hudBox">
            ⭐ Nv. ${p.level}
        </div>

        <div class="hudBox">
            ✨ ${p.exp} EXP
        </div>

    `;

    document.getElementById(
        "masterMessageText"
    ).textContent =
        state.narrative || "";

    document.getElementById(
        "calendarText"
    ).textContent =
        `Ano ${state.calendar.year},
         mês ${state.calendar.month},
         dia ${state.calendar.day}`;

}


/* =========================================================
   INVENTÁRIO
========================================================= */

function renderInventory() {

    const list =
        document.getElementById(
            "inventoryList"
        );

    if(!state.inventory.length) {

        list.innerHTML =
            `<div class="card">
                Inventário vazio.
             </div>`;

        return;

    }


    list.innerHTML =
        state.inventory
        .map(item => `

            <div class="inventoryItem">

                🎒
                ${escapeHTML(item.name)}

                × ${item.qty || 1}

            </div>

        `)
        .join("");

}


/* =========================================================
   STATUS
========================================================= */

function renderStatus() {

    const p = state.player;

    const rows = {

        "❤️ Vida":
            `${p.hp}/${p.hpMax}`,

        "💙 Mana":
            `${p.mana}/${p.manaMax}`,

        "🟢 Stamina":
            `${p.stamina}/${p.staminaMax}`,

        "⭐ Nível":
            p.level,

        "✨ EXP":
            p.exp,

        "📍 Local":
            state.world.location,

        "🌦️ Clima":
            state.world.weather,

        "🕐 Hora":
            state.world.time

    };


    document.getElementById(
        "statusList"
    ).innerHTML =

        Object.entries(rows)
        .map(
            ([name,value]) => `

                <div class="statusRow">

                    <span>
                        ${name}
                    </span>

                    <b>
                        ${escapeHTML(value)}
                    </b>

                </div>

            `
        )
        .join("");

}


/* =========================================================
   RENDERIZADOR DE CAMADAS
========================================================= */

function renderLayers() {

    const root =
        document.getElementById(
            "layers"
        );

    root.innerHTML = "";


    state.layers.forEach(
        (layer,index) => {

            const layerElement =
                document.createElement("div");

            layerElement.className =
                "layer";

            layerElement.dataset.layer =
                index + 1;


            (layer.elements || [])
            .forEach(
                element => {

                    renderEle
