<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color"
content="#080b10">

<title>RPG Mestre IA</title>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;

    background:#080b10;
    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    color:white;
    border:0;
}


/* =====================================================
   APP
===================================================== */

#app{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
}


/* =====================================================
   TOPO
===================================================== */

#topbar{

    height:55px;
    min-height:55px;

    display:flex;
    align-items:center;

    gap:7px;

    padding:
        7px
        max(7px,env(safe-area-inset-right))
        7px
        max(7px,env(safe-area-inset-left));

    background:#111720;

    border-bottom:
        1px solid #303949;

    z-index:5000;
}

#logo{
    flex:1;

    font-size:14px;
    font-weight:bold;

    white-space:nowrap;
}

#connection{

    padding:5px 8px;

    border-radius:20px;

    background:#18202c;

    border:
        1px solid #394456;

    font-size:10px;
}

.topButton{

    width:40px;
    height:40px;

    border-radius:10px;

    background:#202938;

    border:
        1px solid #394456;

    font-size:17px;

    touch-action:manipulation;
}


/* =====================================================
   MUNDO
===================================================== */

#world{

    position:relative;

    flex:1;

    min-height:0;

    overflow:hidden;

    background:
        linear-gradient(
            180deg,
            #314a35 0%,
            #243726 100%
        );

    touch-action:none;

    user-select:none;

    -webkit-user-select:none;
}


/* =====================================================
   CAMADAS
===================================================== */

#layers{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}

.layer{

    position:absolute;

    inset:0;

    pointer-events:none;
}


/* =====================================================
   ELEMENTOS DO MUNDO
===================================================== */

.worldElement{

    position:absolute;

    display:flex;

    align-items:center;

    justify-content:center;

    transform-origin:center;

    pointer-events:auto;

    touch-action:manipulation;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

    cursor:pointer;

    background:transparent;

    border:0;

    padding:0;

    margin:0;
}

.emojiElement{

    font-size:
        clamp(
            32px,
            10vw,
            85px
        );

    line-height:1;

    filter:
        drop-shadow(
            0 5px 4px
            rgba(0,0,0,.6)
        );
}

.textElement{

    padding:6px 9px;

    border-radius:9px;

    background:
        rgba(0,0,0,.55);

    font-size:14px;
}

.imageElement{

    background-repeat:no-repeat;

    background-position:center;

    background-size:contain;
}


/* =====================================================
   HUD
===================================================== */

#hud{

    position:absolute;

    top:8px;
    left:8px;
    right:8px;

    display:flex;

    gap:6px;

    flex-wrap:wrap;

    z-index:1000;

    pointer-events:none;
}

.hudBox{

    padding:6px 9px;

    border-radius:10px;

    background:
        rgba(7,11,17,.9);

    border:
        1px solid #3c4657;

    font-size:11px;

    backdrop-filter:blur(5px);
}


/* =====================================================
   MENSAGEM
===================================================== */

#masterMessage{

    position:absolute;

    left:8px;
    right:8px;
    bottom:8px;

    padding:9px 11px;

    border-radius:13px;

    background:
        rgba(7,11,17,.92);

    border:
        1px solid #3c4657;

    z-index:1200;

    pointer-events:none;

    backdrop-filter:blur(6px);
}

#masterMessageTitle{

    font-size:12px;

    font-weight:bold;

    margin-bottom:3px;
}

#masterMessageText{

    font-size:13px;

    color:#dce2eb;
}


/* =====================================================
   AÇÕES CRIADAS PELO MESTRE
===================================================== */

#dynamicActions{

    position:absolute;

    left:8px;
    right:8px;
    bottom:72px;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;

    z-index:2000;

    pointer-events:none;
}

.dynamicButton{

    pointer-events:auto;

    padding:10px 13px;

    border-radius:11px;

    background:#1c2635;

    border:
        1px solid #48566c;

    font-size:12px;

    touch-action:manipulation;
}


/* =====================================================
   BARRA
===================================================== */

#bottomBar{

    height:70px;
    min-height:70px;

    display:flex;

    gap:6px;

    padding:
        6px
        max(6px,env(safe-area-inset-right))
        max(6px,env(safe-area-inset-bottom))
        max(6px,env(safe-area-inset-left));

    background:#111720;

    border-top:
        1px solid #303949;

    z-index:5000;
}

.bottomButton{

    flex:1;

    min-width:0;

    border-radius:11px;

    background:#1a2230;

    border:
        1px solid #354052;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:2px;

    font-size:18px;

    touch-action:manipulation;
}

.bottomButton span{

    font-size:9px;

    white-space:nowrap;
}


/* =====================================================
   PAINÉIS
===================================================== */

.panel{

    position:absolute;

    top:55px;
    left:0;
    right:0;
    bottom:70px;

    display:none;

    overflow:auto;

    padding:13px;

    background:
        rgba(8,12,18,.98);

    z-index:7000;
}

.panel.active{

    display:block;
}

.panelTitle{

    font-size:20px;

    font-weight:bold;

    margin-bottom:14px;
}

.closeButton{

    float:right;

    width:40px;
    height:40px;

    border-radius:10px;

    background:#252e3c;

    font-size:17px;

    touch-action:manipulation;
}


/* =====================================================
   CARDS
===================================================== */

.card{

    padding:12px;

    margin-bottom:10px;

    border-radius:13px;

    background:#161e2a;

    border:
        1px solid #364154;
}

.card button{

    padding:9px 11px;

    margin:3px;

    border-radius:9px;

    background:#1d2736;

    border:
        1px solid #3c485c;
}

.card input,
.card textarea{

    width:100%;

    padding:10px;

    border-radius:9px;

    color:white;

    background:#101722;

    border:
        1px solid #3b4659;

    outline:none;
}


/* =====================================================
   INVENTÁRIO
===================================================== */

.inventoryItem{

    padding:11px;

    margin-bottom:7px;

    border-radius:10px;

    background:#161e2a;

    border:
        1px solid #364154;
}


/* =====================================================
   STATUS
===================================================== */

.statusRow{

    display:flex;

    justify-content:space-between;

    padding:10px;

    margin-bottom:7px;

    border-radius:10px;

    background:#161e2a;

    border:
        1px solid #364154;
}


/* =====================================================
   CHAT
===================================================== */

#chatLog{

    height:
        calc(100% - 115px);

    overflow-y:auto;

    padding:8px;

    border-radius:12px;

    background:#080c12;

    border:
        1px solid #303949;
}

.chatMessage{

    padding:8px;

    border-bottom:
        1px solid #242c38;

    font-size:13px;
}

.chatMessage strong{

    display:block;

    margin-bottom:3px;
}

#chatArea{

    display:flex;

    gap:7px;

    margin-top:8px;
}

#chatInput{

    flex:1;

    resize:none;

    color:white;

    background:#111822;

    border:
        1px solid #384356;

    border-radius:10px;

    padding:9px;
}

#sendChat{

    width:52px;

    border-radius:10px;

    background:#202b3b;

    border:
        1px solid #455268;

    font-size:18px;

    touch-action:manipulation;
}


/* =====================================================
   ORIENTAÇÃO
===================================================== */

@media(max-width:600px) and (orientation:portrait){

    #world::after{

        content:
            "↻  Gire o celular para paisagem";

        position:absolute;

        inset:0;

        display:flex;

        align-items:center;

        justify-content:center;

        background:
            rgba(0,0,0,.72);

        font-weight:bold;

        z-index:9998;

        pointer-events:none;
    }
}

</style>

</head>


<body>


<div id="app">


<!-- =====================================================
     TOPO
===================================================== -->

<header id="topbar">

    <div id="logo">
        🧙 RPG Mestre IA
    </div>

    <div id="connection">
        ⚪ LOCAL
    </div>

    <button
        class="topButton"
        id="settingsButton">

        ⚙️

    </button>

</header>


<!-- =====================================================
     MUNDO
===================================================== -->

<main id="world">

    <div id="layers"></div>

    <div id="hud"></div>

    <div id="dynamicActions"></div>

    <div id="masterMessage">

        <div id="masterMessageTitle">
            🧙 Mestre
        </div>

        <div id="masterMessageText">
            O mundo está pronto.
        </div>

    </div>

</main>


<!-- =====================================================
     BARRA
===================================================== -->

<nav id="bottomBar">

    <button
        class="bottomButton"
        id="inventoryButton">

        🎒

        <span>
            Inventário
        </span>

    </button>


    <button
        class="bottomButton"
        id="statusButton">

        📊

        <span>
            Status
        </span>

    </button>


    <button
        class="bottomButton"
        id="systemButton">

        ⚙️

        <span>
            Sistema
        </span>

    </button>


    <button
        class="bottomButton"
        id="moveButton">

        🚶

        <span>
            Andar
        </span>

    </button>


    <button
        class="bottomButton"
        id="masterButton">

        💬

        <span>
            Mestre
        </span>

    </button>

</nav>


<!-- =====================================================
     INVENTÁRIO
===================================================== -->

<section
    class="panel"
    id="inventoryPanel">

    <button
        class="closeButton"
        data-close>

        ✕

    </button>

    <div class="panelTitle">
        🎒 Inventário
    </div>

    <div id="inventoryList"></div>

</section>


<!-- =====================================================
     STATUS
===================================================== -->

<section
    class="panel"
    id="statusPanel">

    <button
        class="closeButton"
        data-close>

        ✕

    </button>

    <div class="panelTitle">
        📊 Status
    </div>

    <div id="statusList"></div>

</section>


<!-- =====================================================
     SISTEMA
===================================================== -->

<section
    class="panel"
    id="systemPanel">

    <button
        class="closeButton"
        data-close>

        ✕

    </button>

    <div class="panelTitle">
        ⚙️ Sistema
    </div>


    <div class="card">

        <button id="saveButton">
            💾 Salvar
        </button>

        <button id="loadButton">
            📂 Carregar
        </button>

        <button id="newGameButton">
            🆕 Novo jogo
        </button>

    </div>


    <div class="card">

        <b>
            📅 Data
        </b>

        <p id="calendarText"></p>

    </div>

</section>


<!-- =====================================================
     CONFIGURAÇÕES
===================================================== -->

<section
    class="panel"
    id="settingsPanel">

    <button
        class="closeButton"
        data-close>

        ✕

    </button>

    <div class="panelTitle">
        ⚙️ Configurações
    </div>


    <div class="card">

        <b>
            📱 Tela
        </b>

        <br><br>

        <button id="fullscreenButton">
            ⛶ Tela cheia
        </button>

        <button id="landscapeButton">
            📱 Paisagem
        </button>

    </div>


    <div class="card">

        <b>
            🌐 Servidor do Mestre
        </b>

        <br><br>

        <input
            id="serverURL"
            placeholder="https://seu-servidor.com">

        <br><br>

        <button id="testServerButton">
            🔌 Testar
        </button>

        <p style="font-size:11px;opacity:.65">

            Nunca coloque a chave da API neste HTML.

            Ela deve ficar no servidor.

        </p>

    </div>

</section>


<!-- =====================================================
     CHAT
===================================================== -->

<section
    class="panel"
    id="masterPanel">

    <button
        class="closeButton"
        data-close>

        ✕

    </button>

    <div class="panelTitle">
        🧙 Mestre
    </div>


    <div id="chatLog"></div>


    <div id="chatArea">

        <textarea
            id="chatInput"
            rows="2"
            placeholder="Fale com o Mestre...">
        </textarea>

        <button id="sendChat">
            ➤
        </button>

    </div>

</section>


</div>


<script>

/* =====================================================
   ESTADO PADRÃO
===================================================== */

const DEFAULT_STATE = {

    calendar:{
        year:3,
        month:8,
        day:19
    },


    player:{

        name:"Jogador",

        hp:100,
        hpMax:100,

        mana:80,
        manaMax:80,

        stamina:100,
        staminaMax:100,

        level:1,

        exp:0,

        x:50,
        y:70
    },


    world:{

        location:"Floresta",

        weather:"Normal",

        time:"18:42"
    },


    inventory:[

        {
            name:
            "Fragmento de Cristal de Sintonia",

            qty:1
        }

    ],


    /*
       50 camadas.

       O número pode crescer
       automaticamente.
    */

    layers:
        Array.from(
            {length:50},
            (_,index)=>({

                id:index+1,

                elements:[]

            })
        ),


    actions:[],

    narrative:
        "O mundo está pronto."
};


/* =====================================================
   CARREGAMENTO
===================================================== */

function loadState(){

    try{

        const saved =
            localStorage.getItem(
                "RPG_MESTRE_STATE"
            );

        if(saved){

            const parsed =
                JSON.parse(saved);

            return parsed;

        }

    }catch(error){

        console.error(error);

    }

    return structuredClone(
        DEFAULT_STATE
    );
}


let state =
    loadState();


/* =====================================================
   UTILITÁRIOS
===================================================== */

function saveSilently(){

    localStorage.setItem(

        "RPG_MESTRE_STATE",

        JSON.stringify(state)

    );
}


function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");
}


/* =====================================================
   PAINÉIS
===================================================== */

function openPanel(id){

    document
        .querySelectorAll(".panel")
        .forEach(
            panel =>
                panel.classList.remove(
                    "active"
                )
        );

    document
        .getElementById(id)
        .classList.add("active");
}


function closePanels(){

    document
        .querySelectorAll(".panel")
        .forEach(
            panel =>
                panel.classList.remove(
                    "active"
                )
        );
}


document
    .querySelectorAll("[data-close]")
    .forEach(
        button =>
            button.addEventListener(
                "pointerdown",
                closePanels
            )
    );


/* =====================================================
   BOTÕES
===================================================== */

document
    .getElementById("settingsButton")
    .addEventListener(
        "pointerdown",
        ()=>openPanel("settingsPanel")
    );


document
    .getElementById("inventoryButton")
    .addEventListener(
        "pointerdown",
        ()=>openPanel("inventoryPanel")
    );


document
    .getElementById("statusButton")
    .addEventListener(
        "pointerdown",
        ()=>openPanel("statusPanel")
    );


document
    .getElementById("systemButton")
    .addEventListener(
        "pointerdown",
        ()=>openPanel("systemPanel")
    );


document
    .getElementById("masterButton")
    .addEventListener(
        "pointerdown",
        ()=>openPanel("masterPanel")
    );


/* =====================================================
   HUD
===================================================== */

function renderHUD(){

    const p =
        state.player;


    document
        .getElementById("hud")
        .innerHTML = `

        <div class="hudBox">
            ❤️ ${p.hp}/${p.hpMax}
        </div>

        <div class="hudBox">
            💙 ${p.mana}/${p.manaMax}
        </div>

        <div class="hudBox">
            🟢 ${p.stamina}/${p.staminaMax}
        </div>

        <div class="hudBox">
            ⭐ Nv. ${p.level}
        </div>

        <div class="hudBox">
            ✨ ${p.exp} EXP
        </div>

    `;


    document
        .getElementById(
            "masterMessageText"
        )
        .textContent =
            state.narrative || "";


    document
        .getElementById(
            "calendarText"
        )
        .textContent =

        `Ano ${state.calendar.year}
         • Mês ${state.calendar.month}
         • Dia ${state.calendar.day}`;

}


/* =====================================================
   INVENTÁRIO
===================================================== */

function renderInventory(){

    const list =
        document.getElementById(
            "inventoryList"
        );


    if(
        !state.inventory ||
        !state.inventory.length
    ){

        list.innerHTML =

            `<div class="card">
                Inventário vazio.
             </div>`;

        return;
    }


    list.innerHTML =

        state.inventory
        .map(
            item => `

            <div class="inventoryItem">

                🎒
                ${escapeHTML(item.name)}

                × ${item.qty || 1}

            </div>

            `
        )
        .join("");

}


/* =====================================================
   STATUS
===================================================== */

function renderStatus(){

    const p =
        state.player;


    const rows = {

        "❤️ Vida":
            `${p.hp}/${p.hpMax}`,

        "💙 Mana":
            `${p.mana}/${p.manaMax}`,

        "🟢 Stamina":
            `${p.stamina}/${p.staminaMax}`,

        "⭐ Nível":
            p.level,

        "✨ EXP":
            p.exp,

        "📍 Local":
            state.world.location,

        "🌦️ Clima":
            state.world.weather,

        "🕐 Hora":
            state.world.time
    };


    document
        .getElementById(
            "statusList"
        )
        .innerHTML =

        Object.entries(rows)
        .map(
            ([name,value]) => `

            <div class="statusRow">

                <span>
                    ${name}
                </span>

                <b>
                    ${escapeHTML(value)}
                </b>

            </div>

            `
        )
        .join("");
}


/* =====================================================
   CAMADAS
===================================================== */

function ensureLayer(layerNumber){

    while(
        state.layers.length <
        layerNumber
    ){

        state.layers.push({

            id:
                state.layers.length+1,

            elements:[]

        });

    }

}


/* =====================================================
   ELEMENTOS
===================================================== */

function createWorldElement(
    element
){

    let el;


    /*
       Se for interativo,
       usamos BUTTON.

       Assim o navegador trata
       toque naturalmente.
    */

    if(element.interactive){

        el =
            document.createElement(
                "button"
            );

    }else{

        el =
            document.createElement(
                "div"
            );

    }


    el.className =
        "worldElement";


    el.dataset.id =
        element.id || "";


    /* =================================================
       VISUAL
    ================================================= */

    if(element.emoji){

        el.classList.add(
            "emojiElement"
        );

        el.textContent =
            element.emoji;

    }


    if(element.text){

        el.classList.add(
            "textElement"
        );

        el.textContent =
            element.text;

    }


    if(element.image){

        el.classList.add(
            "imageElement"
        );

        el.style.backgroundImage =
            `url("${element.image}")`;

        el.style.width =
            element.width ||
            "80px";

        el.style.height =
            element.height ||
            "80px";

    }


    /* =================================================
       POSIÇÃO
    ================================================= */

    el.style.left =
        (element.x ?? 50) + "%";


    el.style.top =
        (element.y ?? 50) + "%";


    el.style.transform =

        `translate(-50%,-50%)
         rotate(${element.rotate || 0}deg)
         scale(${element.scale || 1})`;


    /* =================================================
       TOQUE
    ================================================= */

    if(element.interactive){

        el.addEventListener(
            "pointerdown",
            function(event){

                event.preventDefault();

                event.stopPropagation();


                /*
                   Qualquer objeto pode
                   mandar sua própria mensagem
                   ao Mestre.
                */

                const label =
                    element.label ||
                    element.name ||
                    element.id ||
                    "objeto";


                const message =

                    element.message ||

                    `O jogador tocou em ${label}.`;


                showNarrative(
                    element.feedback ||
                    `Você interagiu com ${label}.`
                );


                askMaster(
                    message,
                    false
                );

            }
        );

    }


    return el;

}


/* =====================================================
   RENDERIZAR CAMADAS
===================================================== */

function renderLayers(){

    const root =
        document.getElementById(
            "layers"
        );


    root.innerHTML = "";


    state.layers.forEach(
        layer => {

            const layerDiv =
                document.createElement(
                    "div"
                );


            layerDiv.className =
                "layer";


            layerDiv.dataset.layer =
                layer.id;


            /*
               IMPORTANTE:

               A própria camada não recebe
               toque.

               Somente os elementos recebem.
            */

            layerDiv.style.zIndex =
                layer.id;


            layerDiv.style.pointerEvents =
                "none";


            (layer.elements || [])
            .forEach(
                element => {

                    const el =
                        createWorldElement(
                            element
                        );


                    layerDiv.appendChild(
                        el
                    );

                }
            );


            root.appendChild(
                layerDiv
            );

        }
    );

}


/* =====================================================
   AÇÕES
===================================================== */

function renderActions(){

    const root =
        document.getElementById(
            "dynamicActions"
        );


    root.innerHTML = "";


    (state.actions || [])
    .forEach(
        action => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "dynamicButton";


            button.textContent =
                action.label ||
                "Ação";


            button.addEventListener(
                "pointerdown",
                function(event){

                    event.preventDefault();

                    event.stopPropagation();


                    askMaster(

                        action.message ||
                        action.label,

                        false

                    );

                }
            );


            root.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderAll(){

    renderHUD();

    renderInventory();

    renderStatus();

    renderLayers();

    renderActions();

}


/* =====================================================
   MOVIMENTO
===================================================== */

let moveMode =
    false;


function toggleMoveMode(){

    moveMode =
        !moveMode;


    const button =
        document.getElementById(
            "moveButton"
        );


    if(moveMode){

        button.style.border =
            "1px solid white";

        showNarrative(
            "🚶 Modo andar ativado. Toque no local para onde deseja ir."
        );

    }else{

        button.style.border =
            "";

        showNarrative(
            "🚶 Modo andar desativado."
        );

    }

}


document
    .getElementById("moveButton")
    .addEventListener(
        "pointerdown",
        toggleMoveMode
    );


/* =====================================================
   TOQUE NO MUNDO
===================================================== */

document
    .getElementById("world")
    .addEventListener(
        "pointerdown",
        function(event){

            /*
               Se tocou em algum objeto,
               o objeto já recebeu o toque.
            */

            if(
                event.target.closest(
                    ".worldElement"
                )
            ){

                return;

            }


            /*
               Botões dinâmicos também
               não são tratados como chão.
            */

            if(
                event.target.closest(
                    ".dynamicButton"
                )
            ){

                return;

            }


            const rect =
                this.getBoundingClientRect();


            const x =
                (
                    event.clientX -
                    rect.left
                )
                /
                rect.width
                *
                100;


            const y =
                (
                    event.clientY -
                    rect.top
                )
                /
                rect.height
                *
                100;


            if(moveMode){

                state.player.x =
                    x;

                state.player.y =
                    y;


                showNarrative(

                    "🚶 Você caminhou até o local."

                );


                askMaster(

                    `O jogador caminhou até `
                    +
                    `(${x.toFixed(1)}%, `
                    +
                    `${y.toFixed(1)}%).`,

                    false

                );


                renderHUD();


            }else{

                /*
                   Mesmo um toque em um espaço vazio
                   pode ser informado ao Mestre.
                */

                askMaster(

                    `O jogador tocou no chão `
                    +
                    `em (${x.toFixed(1)}%, `
                    +
                    `${y.toFixed(1)}%).`,

                    false

                );

            }

        }
    );


/* =====================================================
   NARRATIVA
===================================================== */

function showNarrative(
    text
){

    state.narrative =
        text;

    renderHUD();

}


/* =====================================================
   CHAT
===================================================== */

function addChat(
    author,
    message
){

    const log =
        document.getElementById(
            "chatLog"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "chatMessage";


    const strong =
        document.createElement(
            "strong"
        );


    strong.textContent =
        author;


    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        message;


    div.appendChild(
        strong
    );


    div.appendChild(
        text
    );


    log.appendChild(
        div
    );


    log.scrollTop =
        log.scrollHeight;

}


/* =====================================================
   MANDAR CHAT
===================================================== */

async function sendChat(){

    const input =
        document.getElementById(
            "chatInput"
        );


    const message =
        input.value.trim();


    if(!message){

        return;

    }


    input.value = "";


    await askMaster(
        message,
        true
    );

}


document
    .getElementById("sendChat")
    .addEventListener(
        "pointerdown",
        function(event){

            event.preventDefault();

            sendChat();

        }
    );


document
    .getElementById("chatInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();

                sendChat();

            }

        }
    );


/* =====================================================
   MESTRE / SERVIDOR
===================================================== */

async function askMaster(
    message,
    showInChat=true
){

    if(showInChat){

        addChat(
            "Você",
            message
        );

    }


    const server =
        document
        .getElementById(
            "serverURL"
        )
        .value
        .trim();


    /*
       Ainda sem servidor:

       o jogo funciona normalmente,
       mas não há IA conectada.
    */

    if(!server){

        showNarrative(

            "📡 O Mestre está offline. Configure o servidor para conectar a IA."

        );

        return;

    }


    try{

        document
            .getElementById(
                "connection"
            )
            .textContent =
                "🟡 MESTRE";


        const response =
            await fetch(

                server.replace(/\/$/,"")
                +
                "/api/master",

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:

                        JSON.stringify({

                            message:message,

                            state:state

                        })

                }

            );


        if(!response.ok){

            throw new Error(
                "HTTP "
                +
                response.status
            );

        }


        const data =
            await response.json();


        if(data.state){

            state =
                data.state;

        }


        if(data.narrative){

            state.narrative =
                data.narrative;

        }


        if(
            Array.isArray(
                data.commands
            )
        ){

            executeCommands(
                data.commands
            );

        }


        if(showInChat){

            addChat(

                "Mestre",

                data.reply ||
                data.narrative ||
                "..."

            );

        }


        document
            .getElementById(
                "connection"
            )
            .textContent =
                "🟢 MESTRE";


        renderAll();

        saveSilently();

    }

    catch(error){

        console.error(error);


        document
            .getElementById(
                "connection"
            )
            .textContent =
                "🔴 OFFLINE";


        if(showInChat){

            addChat(

                "Sistema",

                "Não consegui conectar ao servidor do Mestre."

            );

        }

    }

}


/* =====================================================
   COMANDOS DO MESTRE
===================================================== */

function executeCommands(
    commands
){

    commands.forEach(
        command => {

            switch(
                command.type
            ){

                case "message":

                    state.narrative =
                        command.text;

                    break;


                case "set_narrative":

                    state.narrative =
                        command.text;

                    break;


                case "set_player":

                    Object.assign(

                        state.player,

                        command.values ||
                        {}

                    );

                    break;


                case "set_world":

                    Object.assign(

                        state.world,

                        command.values ||
                        {}

                    );

                    break;


                case "add_item":{

                    const existing =
                        state.inventory
                        .find(
                            item =>
                                item.name ===
                                command.name
                        );


                    if(existing){

                        existing.qty =
                            (existing.qty || 1)
                            +
                            (command.qty || 1);

                    }else{

                        state.inventory.push({

                            name:
                                command.name,

                            qty:
                                command.qty || 1

                        });

                    }

                    break;

                }


                case "add_layer":

                    ensureLayer(
                        command.layer
                    );


                    state.layers[
                        command.layer - 1
                    ].elements =
                        command.elements ||
                        [];


                    break;


                case "add_element":

                    ensureLayer(
                        command.layer
                    );


                    state.layers[
                        command.layer - 1
                    ].elements.push(

                        command.element

                    );


                    break;


                case "remove_element":

                    state.layers.forEach(
                        layer => {

                            layer.elements =
                                (
                                    layer.elements ||
                                    []
                                )
                                .filter(

                                    element =>
                                        element.id !==
                                        command.id

                                );

                        }
                    );

                    break;


                case "clear_layer":

                    ensureLayer(
                        command.layer
                    );


                    state.layers[
                        command.layer - 1
                    ].elements = [];


                    break;


                case "set_actions":

                    state.actions =
                        command.actions ||
                        [];


                    break;


                case "add_action":

                    state.actions.push(
                        command.action
                    );


                    break;


                case "clear_actions":

                    state.actions = [];


                    break;

            }

        }
    );

}

/* =====================================================
   API INTERNA DO RPG
===================================================== */

window.RPG = {


    getState(){

        return structuredClone(
            state
        );

    },


    save(){

        saveSilently();

    },


    render(){

        renderAll();

    },


    message(
        text
    ){

        showNarrative(
            text
        );

    },


    addLayer(
        layerNumber
    ){

        ensureLayer(
            layerNumber
        );

        renderAll();

    },


    addElement(
        layerNumber,
        element
    ){

        ensureLayer(
            layerNumber
        );


        state.layers[
            layerNumber - 1
        ].elements.push(
            element
        );


        renderAll();

    },


    removeElement(
        id
    ){

        executeCommands([

            {

                type:
                    "remove_element",

                id:id

            }

        ]);


        renderAll();

    },


    addAction(
        action
    ){

        state.actions.push(
            action
        );


        renderAll();

    }

};
